<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>Your abaya landing harness (mobile)</title>
  <style>
    body { margin: 0; padding: 16px; background: #e5e7eb; display: flex; gap: 16px; justify-content: center; }
    iframe { width: 390px; height: 844px; border: 0; border-radius: 24px; background: #fff; box-shadow: 0 10px 30px rgb(0 0 0 / 20%); }
    /* ?bare=1&h=<px>: frame pinned to the top left at full content height, for captures */
    body.bare { display: block; padding: 0; background: #fff; direction: ltr; }
    body.bare iframe { display: block; border-radius: 0; box-shadow: none; }
  </style>
</head>
<body>
  <!-- Phone-width frames: the components size by container, so this matches a real 390px screen -->
  <iframe id="frame"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    const frame = document.getElementById("frame");
    if (params.get("bare")) {
      document.body.classList.add("bare");
      frame.style.height = `${Number(params.get("h")) || 844}px`;
    }
    frame.src = "landing.html" + location.search;
  </script>
</body>
</html>
